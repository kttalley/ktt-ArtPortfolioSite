{
  "extractor": {
    "base-directory": "../../public/instagram",
    "instagram": {
      "cookies": "./.cookies.txt",
      "api": "rest",
      "include": "posts",
      "sleep-request": [6.0, 12.0],
      "videos": false,
      "directory": [],
      "filename": "{post_shortcode}_{num}.{extension}",
      "postprocessors": [
        {
          "name": "metadata",
          "mode": "json",
          "filename": "{post_shortcode}_{num}.json"
        }
      ]
    }
  }
}
